# Production nginx for Survev on a Pelican node (or any VPS).
# Copy to /etc/nginx/sites-available/survev.conf, then:
#   sudo ln -sf /etc/nginx/sites-available/survev.conf /etc/nginx/sites-enabled/survev.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Edit server_name and root. After TLS: uncomment the 443 server and
# set regions.main.https = true in survev-config.hjson.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream survev_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream survev_game {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME;

    root /opt/survev/client/dist;
    index index.html;

    client_max_body_size 4m;

    location ~* \.(js|css|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        etag off;
        if_modified_since off;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~* \.(html)$ {
        etag on;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /stats/ {
        try_files $uri $uri/ /stats/index.html;
    }

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://survev_api;
    }

    location /private {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://survev_api;
    }

    location /team_v2 {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://survev_api;
        proxy_redirect off;
    }

    location /ptc {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        proxy_pass http://survev_game;
        proxy_redirect off;
    }

    # Player session find_game (ticket from master → matchmaking on this game node).
    location /session/ {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_read_timeout 15s;
        proxy_pass http://survev_game;
        proxy_redirect off;
    }

    # Match WebSockets (game children on 9000–9015 with maxGames: 16).
    location ~ ^/g/(?<game_port>9[0-9]+)(?<game_path>/.*)$ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:$game_port$game_path$is_args$args;
        proxy_redirect off;
    }
}

# HTTPS — enable after certbot:
#   sudo certbot --nginx -d your.domain
# Then set regions.main.https: true and oauthRedirectURI to https://your.domain
#
